[package]
name = "prove"
version = "0.3.2"
edition = "2021"
description = "Evidence-gated multi-CLI control plane for coding agents. Agents can claim. Only evidence can advance."
license = "Apache-2.0"
authors = ["Prove Contributors"]
readme = "README.md"
keywords = ["ai", "agents", "cli", "verification", "devtools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
which = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3"




