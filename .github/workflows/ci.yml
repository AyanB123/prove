name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test + prove eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install pytest (trap suite)
        run: python3 -m pip install --user pytest

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

      - name: prove eval traps
        run: ./target/release/prove eval traps

  verify-self:
    name: prove verify --ci (repo policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build prove
        run: cargo build --release && echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Ensure .prove policy for this repo
        run: |
          if [[ ! -f .prove/policy.yml ]]; then
            mkdir -p .prove
            cp examples/ci-policy.cargo-test.yml .prove/policy.yml
          fi
          prove policy show

      - name: prove verify --ci --json
        run: prove verify --ci --json
